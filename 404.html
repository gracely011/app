    <script>
    // Direct Access Fallback Router for Clean URLs (HTTP/HTTPS Only)
    (function handle404Routing() {
        if (!window.location.protocol.startsWith('http')) return;
        try {
            var pathname = window.location.pathname;
            var segments = pathname.split('/').filter(Boolean);
            var lastSegment = (segments[segments.length - 1] || '').toLowerCase();
            
            // Redirect /home or /home.html directly to root index with query & hash
            if (lastSegment === 'home') {
                window.location.replace('/' + window.location.search + window.location.hash);
                return;
            }
            
            var validPages = [
                'admin', 'blocked', 'canva', 'dashboard', 'extension', 'guardrequired',
                'history', 'index', 'kalender-konten', 'login', 'logs', 'maintenance',
                'manual', 'motion', 'password', 'phantomcanva', 'premium', 'privacy',
                'profile', 'reset', 'signup', 'supertools', 'terms', 'tutorial',
                'update', 'youtube-noads'
            ];
            
            if (lastSegment && validPages.indexOf(lastSegment) !== -1) {
                var cleanPath = pathname.replace(/\/+$/, '');
                var targetUrl = (cleanPath.charAt(0) === '/' ? '' : '/') + cleanPath + '.html' + window.location.search + window.location.hash;
                window.location.replace(targetUrl);
            }
        } catch(e) {}
    })();
    </script>
