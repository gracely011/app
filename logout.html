<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logout Berhasil | Gracely</title>
  <script src="assets/js/web-shield.js"></script>
  <link rel="shortcut icon" href="assets/images/favicon.png" type="image/png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/ud-styles.css" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- EKSEKUSI PEMBERSIHAN SESI INSTAN (HEAD-LEVEL SUPER WIPE) -->
  <script>
    (function executeInstantLogout() {
      try {
        console.log('[Gracely Logout] Memulai proses pembersihan menyeluruh...');

        // 1. Daftar token & cookie yang wajib dihapus
        const tokensToWipe = [
          'gracely_session_token',
          'gracely_refresh_token',
          'gracely_active_session',
          'is_premium',
          'gracely_config_url',
          'gracely_plan_sync',
          'supabase_auth_token',
          'sb-draft-auth-token',
          'sb-access-token',
          'sb-refresh-token',
          'userId',
          'isAuthenticated'
        ];

        // 2. Variasi domain dan path untuk kepatuhan RFC 6265
        const domains = ['', '; domain=draft.gracely.my.id', '; domain=.draft.gracely.my.id'];
        const paths = ['; path=/', '; path=/hai/', '; path=/hai'];
        const expires = '; Max-Age=-99999999; expires=Thu, 01 Jan 1970 00:00:00 GMT';

        tokensToWipe.forEach(function(token) {
          domains.forEach(function(d) {
            paths.forEach(function(p) {
              document.cookie = token + '=' + expires + p + d + '; SameSite=Lax';
              document.cookie = token + '=' + expires + p + d + '; SameSite=Lax; Secure';
              document.cookie = token + '=' + expires + p + d;
            });
          });
        });

        // 3. Setel sinyal eksplisit UnangJahaCookieOnLae untuk Gracely Extension di semua domain
        domains.forEach(function(d) {
          document.cookie = 'UnangJahaCookieOnLae=true; path=/; Max-Age=86400; SameSite=Lax' + d;
          document.cookie = 'UnangJahaCookieOnLae=true; path=/; Max-Age=86400; SameSite=Lax; Secure' + d;
        });

        // 4. Bersihkan Web Storage
        if (window.localStorage) {
          try { localStorage.clear(); } catch(e) {}
        }
        if (window.sessionStorage) {
          try { sessionStorage.clear(); } catch(e) {}
        }

        // 5. Bersihkan IndexedDB Databases
        if (window.indexedDB && window.indexedDB.databases) {
          window.indexedDB.databases().then(function(dbs) {
            dbs.forEach(function(dbInfo) {
              if (dbInfo.name && (dbInfo.name.includes('gracely') || dbInfo.name.includes('supabase'))) {
                try { window.indexedDB.deleteDatabase(dbInfo.name); } catch(e) {}
              }
            });
          }).catch(function() {});
        }

        // 6. Bersihkan Cache Storage & Service Worker (Pemberian perlindungan deep wipe)
        if ('caches' in window) {
          try {
            caches.keys().then(function(names) {
              names.forEach(function(n) { caches.delete(n); });
            }).catch(function() {});
          } catch(e) {}
        }
        if ('serviceWorker' in navigator) {
          try {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              registrations.forEach(function(r) { r.unregister(); });
            }).catch(function() {});
          } catch(e) {}
        }

        // 7. Beri notifikasi ke Micro HTTP Server lokal di port 3000
        try {
          fetch('/api/logout-notify', { method: 'POST', mode: 'no-cors' }).catch(function() {});
        } catch(e) {}

        console.log('[Gracely Logout] Seluruh cookie sesi, storage, dan sinyal ekstensi berhasil diproses 100%.');
      } catch (err) {
        console.warn('[Gracely Logout] Peringatan pembersihan:', err);
      }
    })();
  </script>
</head>
<body style="background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b0f19 80%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px;">
  
  <div class="container text-center" style="max-width: 540px;">
    <div style="background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; padding: 44px 32px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);">
      
      <!-- Icon Sukses Animasi -->
      <div style="width: 88px; height: 88px; background: rgba(34, 197, 94, 0.15); border: 2px solid #22c55e; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; box-shadow: 0 0 30px rgba(34, 197, 94, 0.3);">
        <i class="fa-solid fa-check" style="font-size: 40px; color: #22c55e;"></i>
      </div>

      <h1 style="font-weight: 800; font-size: 28px; margin-bottom: 8px; letter-spacing: -0.5px; color: #ffffff;">Logout Berhasil!</h1>
      <p style="color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 24px;">
        Sesi akun Gracely Anda telah berhasil dikeluarkan. Seluruh cookie autentikasi dan token penyimpanan telah dibersihkan secara tuntas.
      </p>

      <!-- Badge Status Sinkronisasi Ekstensi -->
      <div style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 14px; padding: 14px 18px; margin-bottom: 28px; text-align: left; display: flex; align-items: center; gap: 14px;">
        <div style="width: 36px; height: 36px; background: rgba(56, 189, 248, 0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <i class="fa-solid fa-shield-halved" style="color: #38bdf8; font-size: 18px;"></i>
        </div>
        <div>
          <div style="font-weight: 700; font-size: 14px; color: #38bdf8;">Status Gracely Extension</div>
          <div style="font-size: 12px; color: #cbd5e1; margin-top: 2px;">Sinyal pembersihan terkirim. Ekstensi terkunci kembali ke mode standar.</div>
        </div>
      </div>

      <!-- Tombol Aksi -->
      <div style="display: flex; gap: 12px; flex-direction: column;">
        <a href="login.html" style="background: #3b82f6; color: #fff; text-decoration: none; padding: 13px 24px; border-radius: 12px; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);">
          <i class="fa-solid fa-right-to-bracket"></i> Login Kembali
        </a>
        <button onclick="window.close();" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: #94a3b8; padding: 12px 24px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s;">
          Tutup Jendela Ini
        </button>
      </div>

    </div>
  </div>

</body>
</html>
