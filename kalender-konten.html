<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microstock Content Calendar</title>
    <link rel="shortcut icon" href="assets/images/favicon.png" type="image/png" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Montserrat:100,200,300,400,500,600,700,800,900&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Gracely Glassmorphism Style Variables */
        :root {
            --glass-bg-dark: rgba(25, 25, 25, 0.5);
            --glass-border-dark: rgba(255, 255, 255, 0.15);
            --text-color-dark: #ffffff;
            --body-bg-dark: #000000;
            --card-bg-dark: rgba(25, 25, 25, 0.6);
            --filter-bg-dark: transparent;
            --filter-active-bg-dark: #fff;
            --filter-active-color-dark: #000;
            --filter-hover-bg-dark: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--body-bg-dark);
            color: var(--text-color-dark);
            min-height: 100vh;
            text-align: center;
        }

        /* Enable a simple dark gradient background to match Gracely aesthetic if no bg image */
        body {
            background: linear-gradient(135deg, #1f1f1f 0%, #000000 100%);
            background-attachment: fixed;
        }

        header {
            padding: 2rem 1rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background-color: var(--glass-bg-dark);
            border-bottom: 1px solid var(--glass-border-dark);
        }

        .filter-container {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            overflow-x: auto;
            padding: 10px;
        }

        .month-filter {
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--glass-border-dark);
            background-color: var(--filter-bg-dark);
            color: var(--text-color-dark);
            transition: background-color 0.2s, color 0.2s, transform 0.2s;
            white-space: nowrap;
        }

        .month-filter:hover {
            background-color: var(--filter-hover-bg-dark);
            transform: translateY(-2px);
        }

        .month-filter.active {
            background-color: var(--filter-active-bg-dark);
            color: var(--filter-active-color-dark);
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .event-card {
            background-color: var(--card-bg-dark);
            border: 1px solid var(--glass-border-dark);
            border-radius: 15px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: left;
            height: 100%;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .info-badge {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 5px;
        }

        .badge-urgent {
            background-color: #ffc107;
            color: #000;
            animation: pulse 2s infinite;
        }

        .badge-past {
            background-color: #6c757d;
            color: #fff;
        }

        .badge-soon {
            background-color: #fd7e14;
            color: #fff;
        }

        .badge-normal {
            background-color: #17a2b8;
            color: #fff;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                opacity: 1;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--body-bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>

    <!-- Gracely Backend Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script>
      (async () => {
        await requireAuth();
      })();
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  </head>

<body>

    <header>
        <div class="container">
            <h1 class="fw-bold mb-2">Microstock Content Calendar <span id="current-year"></span></h1>
            <p class="mb-0" style="color: #bbb;">Your monthly strategic guide for <span id="current-year-sub"></span>.
            </p>
        </div>
    </header>

    <div class="container">
        <!-- Filter Bulan -->
        <div class="filter-container" id="month-filter-container">
            <!-- Buttons inserted by JS -->
        </div>

        <!-- Kontainer untuk Kartu Event -->
        <div class="row g-4" id="event-container">
            <!-- Cards inserted by JS -->
        </div>

        <!-- Footer -->
        <footer class="mt-5 mb-4 text-white-50" style="font-size: 0.8rem;">
            <p>Version 3.0 | Comprehensive Event List</p>
        </footer>
    </div>

    
    <script src="assets/script.js"></script>
    <script src="assets/js/tools-suite.js"></script>
</body>

</html>
