name: Deploy Encrypted to Main

on:
  push:
    branches: ["dev-clean"]

permissions:
  contents: write
  actions: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev-clean
        uses: actions/checkout@v4
        with:
          ref: dev-clean

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Obfuscator
        run: npm install -g javascript-obfuscator

      - name: Obfuscate ALL JavaScript Files
        run: |
          OPTIONS="--compact true --self-defending true --disable-console-output false --debug-protection true --debug-protection-interval 4000 --domain-lock gracely011.github.io,draft.gracely.my.id --domain-lock-redirect-url https://draft.gracely.my.id/"
          
          # Obfuscate every .js file across the repository (excluding aturhonma.js, vendor libs)
          find . -type f -name "*.js" ! -name "aturhonma.js" ! -name "bootstrap.bundle.min.js" ! -name "wow.min.js" ! -path "*/.git/*" ! -path "*/node_modules/*" ! -path "*/scripts/*" -exec javascript-obfuscator {} --output {} $OPTIONS \;

      - name: Encrypt Assets Inline (aturhonma.js & whitelist.json)
        run: |
          node -e '
          const fs = require("fs");
          const crypto = require("crypto");
          const vm = require("vm");

          const PASSWORD = "kuberserah_selalu_in_GOD";
          const ITERATIONS = 100000;

          async function getKey(password, salt) {
              const enc = new TextEncoder();
              const keyMaterial = await crypto.webcrypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]);
              return await crypto.webcrypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: ITERATIONS, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
          }

          async function encryptData(plainDataObj, password) {
              const jsonString = JSON.stringify(plainDataObj);
              const enc = new TextEncoder();
              const salt = crypto.getRandomValues(new Uint8Array(16));
              const iv = crypto.getRandomValues(new Uint8Array(12));
              const key = await getKey(password, salt);
              const encrypted = await crypto.webcrypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(jsonString));
              return JSON.stringify({
                  s: Buffer.from(salt).toString("base64"),
                  i: Buffer.from(iv).toString("base64"),
                  d: Buffer.from(encrypted).toString("base64")
              });
          }

          (async () => {
              try {
                  if (fs.existsSync("./aturhonma.js")) {
                      let fileContent = fs.readFileSync("./aturhonma.js", "utf8");
                      fileContent = fileContent.replace(/(?:const|let|var)\s+gracelyConfig\s*=/g, "gracelyConfig =");
                      const sandbox = {};
                      vm.createContext(sandbox);
                      vm.runInContext(fileContent, sandbox);
                      if (sandbox.gracelyConfig) {
                          const encrypted = await encryptData(sandbox.gracelyConfig, PASSWORD);
                          fs.writeFileSync("./aturhonma.js", encrypted, "utf8");
                          console.log("✅ Encrypted aturhonma.js successfully");
                      }
                  }
                  if (fs.existsSync("./whitelist.json")) {
                      const jsonContent = JSON.parse(fs.readFileSync("./whitelist.json", "utf8"));
                      if (!jsonContent.s) {
                          const encrypted = await encryptData(jsonContent, PASSWORD);
                          fs.writeFileSync("./whitelist.json", encrypted, "utf8");
                          console.log("✅ Encrypted whitelist.json successfully");
                      }
                  }
              } catch (err) {
                  console.error("Encryption failed:", err);
                  process.exit(1);
              }
          })();
          '
          # Remove scripts folder if any so it never exists on main
          rm -rf scripts/

      - name: Setup Git Config
        run: |
          git config --global user.name "gracely011"
          git config --global user.email "gracely011@users.noreply.github.com"
          git config --global author.name "gracely011"
          git config --global author.email "gracely011@users.noreply.github.com"
          git config --global committer.name "gracely011"
          git config --global committer.email "gracely011@users.noreply.github.com"

      - name: Force Push to Main
        env:
          GIT_AUTHOR_NAME: "gracely011"
          GIT_AUTHOR_EMAIL: "gracely011@users.noreply.github.com"
          GIT_COMMITTER_NAME: "gracely011"
          GIT_COMMITTER_EMAIL: "gracely011@users.noreply.github.com"
        run: |
          # Environment is now encrypted. Push to main.
          git --work-tree=. add .
          git commit -m "Deploy: Encrypted build from dev-clean" --author="gracely011 <gracely011@users.noreply.github.com>"
          git push origin HEAD:main --force

      - name: Trigger Pages Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run static.yml --ref main || true
